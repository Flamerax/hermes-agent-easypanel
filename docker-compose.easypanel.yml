services:
  hermes:
    build: .
    image: hermes-agent
    restart: unless-stopped

    volumes:
      - hermes-data:/opt/data

    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DASHBOARD_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD}

    command: ["gateway", "run"]

volumes:
  hermes-data:
